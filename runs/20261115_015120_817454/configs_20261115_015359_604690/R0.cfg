enable
clear ip nat translation *
configure terminal
hostname R0
no ip nat inside source list 1 pool UC04 overload
no ip nat pool UC04
no access-list 1
interface GigabitEthernet0/0
no ip nat inside
no ip address
exit
interface GigabitEthernet0/0
no shutdown
exit
interface GigabitEthernet0/0.30
encapsulation dot1Q 30
ip address 192.168.30.254 255.255.255.0
no shutdown
exit
interface GigabitEthernet0/0.40
encapsulation dot1Q 40
ip address 192.168.40.254 255.255.255.0
no shutdown
exit
interface GigabitEthernet0/1
ip address 218.75.230.253 255.255.255.252
no shutdown
exit
ip route 0.0.0.0 0.0.0.0 218.75.230.254
interface GigabitEthernet0/0.30
ip nat inside
exit
interface GigabitEthernet0/0.40
ip nat inside
exit
interface GigabitEthernet0/1
ip nat outside
exit
access-list 1 permit 192.168.30.0 0.0.0.255
access-list 1 permit 192.168.40.0 0.0.0.255
ip nat pool UC07 218.75.230.253 218.75.230.253 netmask 255.255.255.252
ip nat inside source list 1 pool UC07 overload
ip access-list extended GUEST_IN
permit icmp 192.168.30.0 0.0.0.255 192.168.40.0 0.0.0.255 echo-reply
permit tcp 192.168.30.0 0.0.0.255 192.168.40.0 0.0.0.255 established
deny ip 192.168.30.0 0.0.0.255 192.168.40.0 0.0.0.255
permit ip any any
exit
interface GigabitEthernet0/0.30
ip access-group GUEST_IN in
exit
end
