enable
configure terminal
hostname R1
no router rip
interface Serial0/0/0
ip address 10.0.0.2 255.255.255.252
no shutdown
exit
interface Serial0/0/1
ip address 20.0.0.1 255.255.255.252
clock rate 2000000
no shutdown
exit
router ospf 100
network 10.0.0.0 0.0.0.3 area 0
network 20.0.0.0 0.0.0.3 area 0
exit
end
