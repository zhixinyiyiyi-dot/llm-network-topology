enable
configure terminal
hostname R1
interface GigabitEthernet0/0
ip address 10.0.0.2 255.255.255.0
no shutdown
exit
interface Loopback0
ip address 20.0.0.1 255.255.255.0
no shutdown
exit
router bgp 200
bgp router-id 20.0.0.1
no auto-summary
network 20.0.0.0 mask 255.255.255.0
neighbor 10.0.0.1 remote-as 100
exit
end
