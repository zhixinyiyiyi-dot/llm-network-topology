enable
configure terminal
hostname R1
no router ospf 100
interface Serial0/0/0
ip address 10.0.0.2 255.255.255.252
no shutdown
exit
interface Serial0/0/1
ip address 172.16.0.1 255.255.255.252
clock rate 2000000
no shutdown
exit
router ospf 1
network 10.0.0.0 0.0.0.3 area 0
network 172.16.0.0 0.0.0.3 area 100
exit
end
