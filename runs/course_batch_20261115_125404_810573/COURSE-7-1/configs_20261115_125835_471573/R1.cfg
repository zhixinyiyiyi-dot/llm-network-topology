enable
configure terminal
hostname R1
interface GigabitEthernet0/0
ip address 192.168.1.254 255.255.255.0
no shutdown
exit
interface GigabitEthernet0/1
ip address 10.0.0.2 255.255.255.252
no shutdown
exit
ip route 192.168.0.0 255.255.255.0 10.0.0.1
ip access-list extended COURSE_ACL
deny tcp 192.168.0.0 0.0.0.255 192.168.1.2 0.0.0.0 eq 80
deny tcp 192.168.0.1 0.0.0.0 192.168.1.2 0.0.0.0 eq 20
deny tcp 192.168.0.1 0.0.0.0 192.168.1.2 0.0.0.0 eq 21
deny ip 192.168.0.2 0.0.0.0 192.168.1.1 0.0.0.0
deny icmp 192.168.0.0 0.0.0.255 10.0.0.2 0.0.0.0
permit ip any any
exit
interface GigabitEthernet0/1
ip access-group COURSE_ACL in
exit
end
